services:
  xianyu-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xianyu-manager:latest
    container_name: xianyu-manager
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/bash", "-c", "dos2unix /app/entrypoint.sh 2>/dev/null || true; bash /app/entrypoint.sh"]
    ports:
      - "8848:8848"
      - "5900:5900"    # VNC 端口（可选，用于远程查看浏览器）
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./global_config.yml:/app/global_config.yml:ro
      - ./backups:/app/backups:rw
      - .:/app:rw
    environment:
      # 虚拟显示（有头模式）
      USE_XVFB: "true"
      ENABLE_HEADFUL: "true"
      ENABLE_VNC: "true"
      DISPLAY: ":99"

      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      PYTHONDONTWRITEBYTECODE: ${PYTHONDONTWRITEBYTECODE:-1}
      TZ: ${TZ:-Asia/Shanghai}
      DB_PATH: ${DB_PATH:-/app/data/xianyu_data.db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # 必填密钥：必须通过 .env 或宿主环境显式提供，避免容器在应用启动后才因缺失崩溃
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env or your shell before running docker compose}"
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:?Set SECRET_ENCRYPTION_KEY in .env or your shell before running docker compose}"

      # 功能开关
      AUTO_REPLY_ENABLED: ${AUTO_REPLY_ENABLED:-true}
      AUTO_SHIPPING_ENABLED: ${AUTO_SHIPPING_ENABLED:-true}
      AUTO_CONFIRM_ENABLED: ${AUTO_CONFIRM_ENABLED:-true}
      AI_ENABLED: ${AI_ENABLED:-false}

      # WebSocket
      WEBSOCKET_URL: ${WEBSOCKET_URL:-wss://wss-goofish.dingtalk.com/}

    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2048}M
          cpus: '${CPU_LIMIT:-2.0}'
        reservations:
          memory: ${MEMORY_RESERVATION:-512}M
          cpus: '${CPU_RESERVATION:-0.5}'

  # 可选：Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: xianyu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - xianyu-app
    networks:
      - xianyu-network
    profiles:
      - with-nginx

networks:
  xianyu-network:
    driver: bridge
